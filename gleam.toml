name = "redirect_proxy"
version = "0.2.0"
description = "High performance HTTP redirect server with an administration backend"
licences = ["MIT"]
repository = { type = "github", user = "janalis", repo = "redirect-proxy" }
target = "erlang"

[dependencies]
gleam_stdlib = ">= 0.60.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_regexp = ">= 1.1.0 and < 2.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
mist = ">= 6.0.0 and < 7.0.0"
wisp = ">= 2.0.0 and < 3.0.0"
lustre = ">= 5.0.0 and < 6.0.0"
simplifile = ">= 2.2.0 and < 3.0.0"
tom = ">= 2.0.0 and < 3.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
logging = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.0.0 and < 2.0.0"
jose = ">= 1.11.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
qcheck = ">= 1.0.0 and < 2.0.0"
