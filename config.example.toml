# redirect-proxy configuration.
#
# Every setting can be overridden by an environment variable named
# RP_<SECTION>_<KEY> in upper case, e.g. RP_SERVER_PORT=80 or
# RP_AUTH_OIDC_CLIENT_SECRET=... (lists are comma separated).

[server]
# Public redirect listener.
listen = "0.0.0.0"
port = 8080
# Cache-Control max-age (seconds) sent with permanent redirects (301 / 308).
# Temporary redirects (302 / 303 / 307) are always sent with no-store.
cache_max_age = 3600
# When set, unmatched requests are redirected (302) here instead of a 404.
fallback_url = ""
not_found_body = "Not Found"
# On SIGTERM, seconds during which /readyz answers 503 and connections are
# closed after each response, before the node stops (0 to 60).
shutdown_grace = 5
# "strict": /docs/ and /docs are different paths. "ignore": a request that
# matches no rule is retried with the trailing slash added or removed.
trailing_slash = "strict"
# A path answered by this listener before any rule, for load balancers that
# can only probe the traffic port: 200 while serving, 503 while draining
# before a stop. Empty: off (every path goes to the rules).
health_path = ""
# Requests with a longer path (in bytes) get a 414 without rule lookup.
max_path_bytes = 8192
# Redirect plain HTTP requests to the same URL over HTTPS (301, or 308 for
# methods other than GET and HEAD), before any rule. Requests that a TLS
# proxy marks with X-Forwarded-Proto: https go to the rules.
https_redirect = false

[access_log]
# Traffic logs, one line per request, of the redirect, admin and API
# listeners. The settings below are shared; [access_log.redirect],
# [access_log.admin] and [access_log.api] can override enabled, format and
# output per listener.
# Master switch for every listener:
enabled = true
# Default format. A preset or a template:
#   combined  nginx/Apache Combined Log Format (GoAccess, AWStats, Logstash
#             COMBINEDAPACHELOG, Fluent Bit "apache2", Datadog, Loki...)
#   common    NCSA Common Log Format
#   json      one JSON object per line (Elasticsearch, Loki, Vector, Splunk...)
# A template mixes text and nginx-style variables ($var or ${var}), e.g.
#   format = '$remote_addr "$request" $status $request_time $rule_id'
# Variables: remote_addr remote_user time_local time_iso8601 msec request
# request_method request_uri uri args server_protocol status body_bytes_sent
# request_time host http_referer http_user_agent location rule_id listener,
# plus http_<header> for any request header (e.g. $http_x_request_id).
# $http_authorization, $http_proxy_authorization and $http_cookie are refused:
# they would write credentials to the log.
format = "combined"
# Escaping of values in templates: "default" (nginx: \xHH), "json" or "none".
escape = "default"
# Default output: "stdout", "stderr" or a file path, absolute or relative to
# the working directory (e.g. "/var/log/redirect-proxy/access.log"). Missing
# directories are created; a renamed file (logrotate) is reopened.
output = "stdout"
# GDPR: client addresses are truncated by default (IPv4 /24, IPv6 /48).
# "none" logs full addresses.
anonymize_ip = "truncate"
# GDPR: query strings often carry personal data (e-mails, tokens, tracking
# ids). By default they are left out of the request, the referer and the
# redirect location.
log_query = false
# Take the client address from X-Forwarded-For / X-Real-IP only when the TCP
# peer is one of these proxies (like nginx real_ip). Empty: the peer address.
# The same address is used to throttle admin logins and API token requests.
trusted_proxies = []
# Built-in size based rotation of file output: rotate at max_bytes (0: never,
# leave it to logrotate), keep max_files rotated files, gzip them.
max_bytes = 0
max_files = 7
compress = true

[access_log.redirect]
enabled = true
# Empty: use access_log.format / access_log.output.
format = ""
output = ""

[access_log.admin]
# Admin UI requests (including /healthz and /metrics probes). When the API
# shares the admin port, /api and /oauth requests use [access_log.api].
enabled = true
format = ""
output = ""

[access_log.api]
enabled = true
format = ""
output = ""

[admin]
enabled = true
# Keep the administration on a private interface (or behind a reverse proxy).
listen = "127.0.0.1"
port = 8081
# Externally visible URL of the admin, used to build the OIDC redirect URI.
public_url = "http://localhost:8081"
# Secret used to sign session cookies (at least 64 characters). When empty a
# random secret is generated and stored in <data_dir>/secret_key_base.
secret_key_base = ""
# Bearer token required by /metrics (at least 16 characters). Empty: /metrics
# is public, like /healthz and /readyz.
metrics_token = ""
# Session lifetime in seconds.
session_ttl = 28800
# A session unused for this many seconds ends (0: never).
session_idle_timeout = 3600

[log]
# The application log (the access log is configured below). Level: debug,
# info, warning, error, critical or none. Format: "text", or "json" for one
# JSON object per line ({time, level, msg, domain}).
level = "info"
format = "text"

[storage]
# Holds redirects.json, users.json, audit.jsonl, backups/ and the cookie secret.
data_dir = "./data"
# Number of previous redirects.json versions kept in data_dir/backups.
backups = 10
# Seconds between checks of redirects.json for changes made outside the
# server (ConfigMap, GitOps, an editor). A change is reloaded like SIGHUP.
# 0: off.
watch_interval = 0
# audit.jsonl is rotated to audit.jsonl.1 (then .2...) once it reaches this
# size in bytes (0: never), keeping audit_files rotated files.
audit_max_bytes = 10485760
audit_files = 5

[auth.local]
# Username / password accounts stored in users.json.
enabled = true

[auth.oidc]
# OpenID Connect single sign-on (Keycloak, Entra ID, Google, Okta, Authentik...).
# Register <public_url>/auth/oidc/callback as redirect URI at the provider.
enabled = false
issuer = "https://idp.example.com/realms/main"
client_id = "redirect-proxy"
client_secret = ""
scopes = ["openid", "email", "profile"]
# Who may sign in. With all three lists empty every user of the provider is
# accepted. Otherwise a user must match at least one entry. E-mails and
# domains only match when the ID token has email_verified = true.
allowed_emails = []
allowed_domains = []
allowed_groups = []
groups_claim = "groups"
button_label = "Sign in with SSO"
# On logout, also sign out at the provider and come back to the login page.
# Register <public_url>/login as a post-logout redirect URI at the provider.
logout_at_provider = false
# Roles: viewer (see rules, test URLs, export), editor (also change rules,
# import, reload) or admin (also users, API clients and the audit log). A
# user gets the highest role their groups (groups_claim) give, and
# default_role when they are in none of these groups.
admin_groups = []
editor_groups = []
viewer_groups = []
default_role = "admin"

[auth.header]
# Trust an identity header set by an authenticating reverse proxy
# (oauth2-proxy, Authelia, Pomerium...). Only requests whose TCP peer address
# is in trusted_proxies are trusted: never expose the admin port directly
# when this is enabled.
enabled = false
# The identity header. Set user_header = "" to identify users by
# email_header instead; the two are never combined. A request carrying the
# header with several values is refused: make the proxy set, not append to,
# it.
user_header = "X-Forwarded-User"
email_header = "X-Forwarded-Email"
trusted_proxies = ["127.0.0.1/32", "::1/128"]
# A header the proxy sets to the user's role (viewer, editor or admin). Empty:
# every proxy user gets default_role. An unknown value gives viewer.
role_header = ""
default_role = "admin"

[api]
# REST API under /api (bearer tokens) and OAuth 2.0 token endpoint
# (/oauth/token, client credentials grant).
# Manage API clients in the admin ("API clients") or with
# `redirect-proxy client add <name> --scope redirects:write`.
enabled = true
# The API and the admin UI share a listener when they use the same port
# (port = 0 means admin.port). Give the API another port to serve it on its
# own listener: the admin listener then no longer answers /api and /oauth,
# so each can be exposed to different networks. With the admin UI disabled
# the API keeps running on its own listener.
port = 0
# Address of the API's own listener. Empty: admin.listen. When the API shares
# admin.port it must be empty or equal to admin.listen.
listen = ""
# Externally visible URL of the API, shown in the admin usage examples.
# Defaults to admin.public_url (shared) or http://localhost:<port> (own port).
public_url = ""
# Lifetime of access tokens issued by /oauth/token (seconds, 60-86400).
token_ttl = 3600
# Maximum request body size (bulk imports).
max_body_bytes = 10485760

[api.oauth]
# Also accept JWT access tokens issued by an external OAuth 2.0 / OIDC
# authorization server (Keycloak, Entra ID, Auth0, Okta...). Tokens must be
# signed with a key of the issuer JWKS and contain iss, exp and an aud that
# includes `audience`.
enabled = false
issuer = "https://idp.example.com/realms/main"
audience = "redirect-proxy"
# Claim holding the scopes: a space separated string ("scope") or an array
# ("scp" is always read too).
scope_claim = "scope"
# Names of the scopes at your authorization server.
read_scope = "redirects:read"
write_scope = "redirects:write"
ops_scope = "redirects:ops"
# GET /api/audit: sign-ins with client addresses, user and client changes.
audit_scope = "audit:read"
