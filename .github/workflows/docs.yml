name: Docs

# Builds the documentation site (VitePress, docs/) and deploys it to GitHub
# Pages. The screenshots are taken from the server built from the same
# commit, and the coverage badge is measured on it, so both follow every
# push to main, not only documentation changes. Pull requests only build the
# site: a dead link or a screenshot that cannot be taken fails the build.
# The release workflow calls this one after publishing, so that the version
# in the nav is the new tag.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "priv/**"
      - "CHANGELOG.md"
      - "config.example.toml"
      - "scripts/coverage.escript"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the release tag)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: docs-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tags for the version in the nav, history for "last updated"
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/packages
          key: gleam-packages-${{ hashFiles('manifest.toml') }}
      - run: gleam deps download
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npx playwright install --with-deps chromium
        working-directory: docs
      - name: Screenshots
        run: npm run screenshots
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - name: Coverage badge
        if: github.event_name != 'pull_request'
        run: |
          make coverage
          mkdir -p docs/.vitepress/dist/badges
          cp coverage/badge.json docs/.vitepress/dist/badges/coverage.json
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write # publish the site
      id-token: write # authenticate the deployment
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
