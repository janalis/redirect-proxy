name: Image scan

# The released image is scanned before it is pushed, but vulnerabilities are
# found after that too: rescan the published `latest` image every week and
# open (or update) an issue when something fixable turns up.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: "1"
      - name: Report
        if: steps.trivy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Vulnerabilities in the published image ($PLATFORM)"
          {
            echo "The weekly scan of \`ghcr.io/$REPO:latest\` ($PLATFORM) found fixable HIGH or CRITICAL vulnerabilities: rebuild on an updated base image and release. Run: $RUN_URL"
            echo
            echo '```'
            head -c 60000 trivy.txt
            echo '```'
          } > body.md
          number=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPO" --body-file body.md
          else
            gh issue create -R "$REPO" --title "$title" --body-file body.md
          fi
          exit 1
