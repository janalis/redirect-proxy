name: Release

# release-please maintains a release PR from Conventional Commits. Merging it
# tags vX.Y.Z and creates the GitHub release; the jobs below then build and
# attach the artefacts (in the same workflow: events created with
# GITHUB_TOKEN cannot trigger other workflows).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build artefacts for, e.g. v1.2.3
        required: true

permissions:
  contents: read

# Two quick pushes to main must not run release-please, nor publish
# artefacts, side by side. Queued, never cancelled: a cancelled run could
# leave a release half published.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with GITHUB_TOKEN does not trigger the CI workflow:
          # set RELEASE_PLEASE_TOKEN (see CONTRIBUTING.md) to get checks on
          # the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  meta:
    name: Release metadata
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - id: meta
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The tag is used in paths and shell commands of the jobs below.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
          # Rebuilding an older release must not move the `latest` image tag.
          highest=$(gh api "repos/$REPO/tags" --paginate --jq '.[].name' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          latest=false
          if [ "$TAG" = "$highest" ]; then latest=true; fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "$TAG (latest: $latest, highest tag: $highest)"

  # the release PR gets no CI run without RELEASE_PLEASE_TOKEN: nothing is
  # built nor published from a tag whose tests fail
  test:
    name: Test the tag
    needs: meta
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.tag }}
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam build --warnings-as-errors
      - run: gleam test

  linux:
    name: Linux ${{ matrix.arch }} bundle and .deb
    needs: [meta, test]
    if: always() && needs.test.result == 'success'
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      ARCH: ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.tag }}
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - run: gleam deps download
      - name: Bundle with the Erlang runtime
        run: scripts/bundle.sh "${VERSION}" "linux-${ARCH}" --with-erts
      - name: Build .deb
        env:
          MAINTAINER: ${{ vars.PACKAGE_MAINTAINER || 'Janalis' }}
        run: |
          scripts/package-deb.sh "${VERSION}" "${ARCH}" \
            "dist/redirect-proxy-${VERSION}-linux-${ARCH}"
      - name: Install, upgrade, remove and purge the .deb
        run: scripts/test-deb.sh "${VERSION}" "${ARCH}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  portable:
    name: Portable bundle (system Erlang)
    needs: [meta, test]
    if: always() && needs.test.result == 'success'
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.tag }}
      # Compiled with the oldest supported OTP so it loads on every newer one.
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27.3"
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - run: gleam deps download
      - run: scripts/bundle.sh "${VERSION}" erlang
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS smoke test (Homebrew Erlang)
    needs: [meta, portable]
    if: always() && needs.portable.result == 'success'
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portable
          path: dist
      - run: brew install erlang
      - run: |
          tar -xzf "dist/redirect-proxy-${VERSION}-erlang.tar.gz" -C dist
          "dist/redirect-proxy-${VERSION}-erlang/bin/redirect-proxy" version

  container:
    name: Container image
    # Only once every artefact built and passed its install test: a failed
    # release must not leave a pushed image (nor a moved `latest`) behind.
    needs: [meta, linux, portable, macos]
    if: always() && needs.meta.result == 'success' && needs.linux.result == 'success' && needs.portable.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.meta.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.latest }}
      # Scan each platform before publishing: a failing scan must not leave a
      # pushed image (nor a moved `latest`) behind. The push below reuses the
      # layers built here.
      - name: Build the amd64 image for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: redirect-proxy:scan-amd64
          cache-from: type=gha
      - name: Scan the amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: redirect-proxy:scan-amd64
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build the arm64 image for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: redirect-proxy:scan-arm64
          cache-from: type=gha
      - name: Scan the arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: redirect-proxy:scan-arm64
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish release assets
    needs: [meta, linux, portable, macos]
    if: always() && needs.linux.result == 'success' && needs.portable.result == 'success' && needs.macos.result == 'success'
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      portable_sha256: ${{ steps.sums.outputs.portable_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - id: sums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz ./*.deb | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS
          echo "portable_sha256=$(grep -- '-erlang.tar.gz' SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # From manifest.toml: scanners find no Gleam/Hex packages in the
      # archives (the previous syft SBOM listed only the archives themselves)
      - name: SBOM
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: python3 scripts/sbom.py "${VERSION}" > "dist/redirect-proxy-${VERSION}.spdx.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" --clobber \
            dist/*.tar.gz dist/*.deb dist/SHA256SUMS dist/*.spdx.json

  homebrew:
    name: Update Homebrew tap
    needs: [meta, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.tag }}
      - name: Render and push the formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          SHA256: ${{ needs.publish.outputs.portable_sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, skipping the Homebrew tap update"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA256}/g" \
            packaging/homebrew/redirect-proxy.rb.in > tap/Formula/redirect-proxy.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/redirect-proxy.rb
          # a rebuild of the same release leaves the formula unchanged
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "redirect-proxy ${VERSION}"
          git push

  # The site again, from the tag: the version in its nav is the new release.
  docs:
    name: Documentation
    needs: [meta, publish]
    permissions:
      contents: read
      pages: write # publish the site
      id-token: write # authenticate the deployment
    # The "$/" self-repository form is not understood by actionlint 1.7.12 yet.
    uses: ./.github/workflows/docs.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.meta.outputs.tag }}

  # The comparison with other servers, for the new release; on main it
  # opens a pull request with the results (see bench.yml).
  benchmark:
    name: Benchmark
    needs: [meta, publish]
    permissions:
      contents: write # push the results branch
      pull-requests: write # open the pull request
    uses: ./.github/workflows/bench.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.meta.outputs.tag }}
