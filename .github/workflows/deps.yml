name: Dependencies

# Dependabot does not support Gleam: check the locked Hex packages every week
# and open (or update) an issue when newer versions are available.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  outdated:
    name: Outdated Hex packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # open or update the report issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - run: gleam deps download
      - id: outdated
        run: |
          gleam deps outdated | tee outdated.txt
          if grep -q '^0 of ' outdated.txt; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report
        if: steps.outdated.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Outdated Hex packages"
          {
            echo "Newer versions of locked Hex packages are available: run \`gleam deps update\` (or raise the bounds in \`gleam.toml\` for a new major version), then \`make check\`. Run: $RUN_URL"
            echo
            echo '```'
            head -c 60000 outdated.txt
            echo '```'
          } > body.md
          number=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPO" --body-file body.md
          else
            gh issue create -R "$REPO" --title "$title" --body-file body.md
          fi
