name: Benchmark

# `bench`: load test of redirect-proxy alone (scripts/bench.sh).
# `compare`: the same rules served by redirect-proxy, nginx, HAProxy, Caddy,
# Traefik and Apache httpd (scripts/bench-compare.py), every week and after
# each release. On main, `publish` opens (or updates) a pull request with
# the new docs/data/benchmark.json and README table, and merges it when every
# server passed its check (then redeploys the docs).
#
# A/B (manual runs): `variants` and `baseline` add redirect-proxy variants,
# measured in the same job (runners differ from run to run), and `profile`
# records where its schedulers spend their time. `scenarios` and `upstream`
# add scenarios (mixed traffic, a connection per request, forwarding to an
# upstream), `soak` replaces them with a long mixed run that tracks memory.
# Their results are an artifact only: nothing is published.

on:
  workflow_dispatch:
    inputs:
      requests:
        description: Requests per scenario (redirect-proxy alone)
        default: "200000"
      ref:
        description: Release tag to measure, with its published image (e.g. v0.7.0); empty for the branch
        type: string
        required: false
      variants:
        description: "redirect-proxy variants, `label[@image][=ERL_FLAGS][|K=V,K=V]` separated by `;` (e.g. `sbwt-short=+sbwt short`, `log|RP_ACCESS_LOG_ENABLED=true`)"
        type: string
        required: false
      baseline:
        description: Git ref to build and measure as a variant, e.g. main (A/B of a code change)
        type: string
        required: false
      profile:
        description: Profile redirect-proxy during one scenario (microstate accounting, perf)
        type: boolean
        default: false
      profile_scenario:
        description: Scenario to profile (exact, prefix, regex, miss, or one of `scenarios` or `upstream`)
        type: string
        default: exact
      scenarios:
        description: "Extra scenarios, comma separated: `mixed` (random hits and misses, browser headers, then a fixed-rate pass), `exact-churn` (a connection per request)"
        type: string
        required: false
      upstream:
        description: Also measure misses forwarded to an upstream (nginx), with keep-alive and a connection per request
        type: boolean
        default: false
      soak:
        description: Soak duration (e.g. 10m; per variant, at most 90m in all) instead of the scenarios (not with `scenarios`, `upstream` or `profile`), mixed traffic with the access log on, memory sampled every 15 s
        type: string
        required: false
  schedule:
    - cron: "17 3 * * 1"
  workflow_call:
    inputs:
      ref:
        description: Git ref to measure (the release tag)
        type: string
        required: false

permissions:
  contents: read

jobs:
  bench:
    name: Load test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - name: Install oha
        env:
          OHA_VERSION: "1.16.0"
          # GitHub's digest of the release asset (oha publishes no checksums)
          OHA_SHA256: 620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716
        run: |
          curl -fsSL -o /tmp/oha \
            "https://github.com/hatoo/oha/releases/download/v${OHA_VERSION}/oha-linux-amd64"
          echo "${OHA_SHA256}  /tmp/oha" | sha256sum -c -
          install -m 0755 /tmp/oha /usr/local/bin/oha
          oha --version
      - run: gleam deps download
      - name: Run benchmark
        # pipefail: a failed run must fail the job, not be hidden by `tee`
        shell: bash
        env:
          REQUESTS: ${{ inputs.requests || '200000' }}
        run: |
          make bench TARGET=linux-amd64 | tee bench.txt
          {
            echo '### Redirect listener benchmark'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  compare:
    name: Compare with other servers
    runs-on: ubuntu-24.04
    # a comparison takes about 15 minutes; a soak, its duration on top
    timeout-minutes: 120
    env:
      # a manual A/B run: redirect-proxy only, results as an artifact
      AB: ${{ inputs.variants != '' || inputs.baseline != '' || inputs.profile || inputs.scenarios != '' || inputs.upstream || inputs.soak != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Build the baseline image
        if: inputs.baseline != ''
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE"
          git worktree add ../baseline FETCH_HEAD
          docker build -t redirect-proxy:baseline ../baseline
      - name: Install perf
        if: inputs.profile
        run: sudo apt-get install -y --no-install-recommends "linux-tools-$(uname -r)" || echo "perf unavailable"
      # The servers and oha run in containers (scripts/bench-compare.py).
      # After a release, its published image is measured, under its version;
      # otherwise an image built from the checkout, as "<branch> (<commit>)".
      # With variants, only redirect-proxy is measured, in each variant.
      - name: Run comparison
        if: env.AB != 'true'
        # pipefail: a failed run must fail the job rather than upload the
        # results file of the checkout as if it were new
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          case "$REF" in
            v[0-9]*)
              RP_IMAGE="ghcr.io/${REPO}:${REF#v}" RP_PULL=1 \
                python3 scripts/bench-compare.py | tee compare.txt
              ;;
            *)
              RP_VERSION="${GITHUB_REF_NAME} ($(git rev-parse --short HEAD))" \
                make bench-compare | tee compare.txt
              ;;
          esac
          {
            echo '### Compared with other servers (requests/s)'
            sed -n '/^| Server/,$p' compare.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.AB != 'true'
        with:
          name: benchmark
          path: docs/data/benchmark.json
          if-no-files-found: error
      - name: Run variants
        if: env.AB == 'true'
        # fails (rather than cancels) the job in time to upload compare.txt,
        # which holds the soak samples printed so far
        timeout-minutes: 110
        shell: bash
        env:
          VARIANTS: ${{ inputs.variants }}
          BASELINE: ${{ inputs.baseline }}
          PROFILE: ${{ inputs.profile }}
          PROFILE_SCENARIO: ${{ inputs.profile_scenario || 'exact' }}
          SCENARIOS: ${{ inputs.scenarios }}
          UPSTREAM: ${{ inputs.upstream }}
          SOAK: ${{ inputs.soak }}
        run: |
          if [ -n "$BASELINE" ]; then
            VARIANTS="${BASELINE}@redirect-proxy:baseline${VARIANTS:+;$VARIANTS}"
          fi
          if [ "$UPSTREAM" = true ]; then
            SCENARIOS="${SCENARIOS:+$SCENARIOS,}upstream,upstream-churn"
          fi
          args=(--only redirect-proxy)
          [ "$PROFILE" = true ] && args+=(--profile)
          make docker
          RP_VERSION="${GITHUB_REF_NAME} ($(git rev-parse --short HEAD))" \
            RP_VARIANTS="$VARIANTS" RP_IMAGE=ghcr.io/janalis/redirect-proxy:dev \
            EXTRA_SCENARIOS="$SCENARIOS" PROFILE_SCENARIO="$PROFILE_SCENARIO" \
            SOAK="$SOAK" \
            python3 scripts/bench-compare.py "${args[@]}" | tee compare.txt
          {
            echo '### redirect-proxy variants (requests/s)'
            sed -n '/^| Server/,$p' compare.txt
            for f in build/profile-*.txt; do
              [ -e "$f" ] || continue
              echo "#### $(basename "$f" .txt)"
              echo '```'
              head -60 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # also when a variant failed: the others' results are still there
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && env.AB == 'true' }}
        with:
          name: benchmark-variants
          path: |
            build/benchmark*.json
            build/profile-*.txt
            compare.txt
          if-no-files-found: error

  publish:
    name: Publish results
    needs: compare
    if: github.ref == 'refs/heads/main' && inputs.variants == '' && inputs.baseline == '' && !inputs.profile && inputs.scenarios == '' && !inputs.upstream && inputs.soak == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the results branch, merge it
      pull-requests: write # open the pull request
      actions: write # start the Docs workflow after merging
    concurrency:
      group: benchmark-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark
          path: docs/data
      - name: Open, update or merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$EVENT" in
            schedule) run="weekly run" ;;
            workflow_dispatch) run="manual run" ;;
            *) run="post-release run" ;;
          esac
          body="Results of the $run of the *Benchmark* workflow ($RUN_URL), for the Performance page and the README."
          python3 scripts/bench-compare.py --from docs/data/benchmark.json --readme
          branch=bench/results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add docs/data/benchmark.json README.md
          if git diff --cached --quiet; then
            echo "results unchanged"
            exit 0
          fi
          git commit -m "chore(bench): refresh the comparison with other servers"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          if [ -z "$(gh pr list -R "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create -R "$REPO" --base main --head "$branch" \
              --title "chore(bench): refresh the comparison with other servers" \
              --body "$body"
          else
            gh pr edit "$branch" -R "$REPO" --body "$body"
          fi
          # Merged without review only when every server passed its check;
          # otherwise the pull request waits for someone to look at it.
          if python3 -c 'import json, sys; sys.exit(any(p["status"] != "ok" for p in json.load(open("docs/data/benchmark.json"))["products"]))'; then
            # GitHub may still be computing whether a new pull request is mergeable
            for attempt in 1 2 3 4 5; do
              gh pr merge "$branch" -R "$REPO" --squash --delete-branch && break
              [ "$attempt" = 5 ] && exit 1
              sleep 10
            done
            # a merge made with GITHUB_TOKEN does not trigger the Docs workflow
            gh workflow run docs.yml -R "$REPO" --ref main
          else
            gh pr comment "$branch" -R "$REPO" --body "Not merged automatically: a server failed its check (see $RUN_URL)."
          fi
