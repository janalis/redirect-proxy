name: Benchmark

on:
  workflow_dispatch:
    inputs:
      requests:
        description: Requests per scenario
        default: "200000"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  bench:
    name: Load test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - name: Install oha
        env:
          OHA_VERSION: "1.16.0"
          # GitHub's digest of the release asset (oha publishes no checksums)
          OHA_SHA256: 620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716
        run: |
          curl -fsSL -o /tmp/oha \
            "https://github.com/hatoo/oha/releases/download/v${OHA_VERSION}/oha-linux-amd64"
          echo "${OHA_SHA256}  /tmp/oha" | sha256sum -c -
          install -m 0755 /tmp/oha /usr/local/bin/oha
          oha --version
      - run: gleam deps download
      - name: Run benchmark
        env:
          REQUESTS: ${{ inputs.requests || '200000' }}
        run: |
          make bench TARGET=linux-amd64 | tee bench.txt
          {
            echo '### Redirect listener benchmark'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
