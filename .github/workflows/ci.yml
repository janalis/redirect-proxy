name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/packages
          key: gleam-packages-${{ hashFiles('manifest.toml') }}
      - run: gleam deps download
      - run: scripts/check-versions.sh --online
      - run: make fmt-check build lint-erlang lint-shell
      - name: Release SBOM (as built by the release workflow)
        run: python3 scripts/sbom.py 0.0.0 | python3 -c 'import json, sys; d = json.load(sys.stdin); assert len(d["packages"]) > 2, d'
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor (workflow security)
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo ghcr.io/zizmorcore/zizmor:1.32.0 --offline .github/workflows
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            *.md
            docs/**/*.md
            .github/**/*.md

  commitlint:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs

  test:
    name: Test (OTP ${{ matrix.otp }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # oldest supported releases, then the one of .tool-versions
        otp: ["27.3", "28.1", "tool-versions"]
        runner: [ubuntu-24.04]
        include:
          # arm64 images and bundles are released: test them too
          - otp: tool-versions
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp == 'tool-versions' && env.OTP_VERSION || matrix.otp }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      # compiled dependencies too: Gleam recompiles what changed since
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/packages
            build/dev
          key: gleam-build-${{ runner.arch }}-otp-${{ matrix.otp == 'tool-versions' && env.OTP_VERSION || matrix.otp }}-gleam-${{ env.GLEAM_VERSION }}-${{ hashFiles('manifest.toml') }}
      - run: gleam deps download
      - run: gleam test

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/packages
          key: gleam-packages-${{ hashFiles('manifest.toml') }}
      - run: gleam deps download
      - run: make coverage
      - run: cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  bundle:
    name: Bundle and .deb smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions (.tool-versions)
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/packages
          key: gleam-packages-${{ hashFiles('manifest.toml') }}
      - run: gleam deps download
      - run: make bundle TARGET=linux-amd64
      - name: Run the bundle without Erlang in PATH
        run: |
          bundle="$PWD/dist/redirect-proxy-$(sed -n 's/^version = "\(.*\)"/\1/p' gleam.toml)-linux-amd64"
          data=$(mktemp -d)
          echo '[{"source": "/smoke", "target": "/ok"}]' > "$data/redirects.json"
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$bundle/bin/redirect-proxy" version
          env -i PATH=/usr/bin:/bin HOME="$HOME" RP_STORAGE_DATA_DIR="$data" RP_SERVER_PORT=18080 \
            RP_SERVER_SHUTDOWN_GRACE=3 "$bundle/bin/redirect-proxy" serve &
          pid=$!
          for _ in $(seq 1 50); do curl -s -o /dev/null http://127.0.0.1:18080/ && break; sleep 0.2; done
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:18080/smoke)" = "301 http://127.0.0.1:18080/ok"
          curl -fsS http://127.0.0.1:8081/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/readyz)" = "200"
          # a real SIGTERM: /readyz turns 503 while redirects still work, and
          # the process exits once the grace period is over
          kill -TERM "$pid"
          sleep 0.5
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/readyz)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/smoke)" = "301"
          for _ in $(seq 1 50); do kill -0 "$pid" 2>/dev/null || exit 0; sleep 0.2; done
          echo "still running 10 s after SIGTERM" >&2
          exit 1
      # packaging (nfpm.yaml, maintainer scripts, systemd unit, deb config)
      # is checked before a release is tagged, not after
      - name: Build the .deb
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' gleam.toml)
          scripts/package-deb.sh "$version" amd64 "dist/redirect-proxy-$version-linux-amd64"
      - name: Install, upgrade, remove and purge the .deb
        run: scripts/test-deb.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' gleam.toml)" amd64

  docker:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: redirect-proxy:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          # as locked down as a hardened deployment: read-only root
          # filesystem, no capabilities, writable data volume and /tmp only
          hardened="--read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges"
          # the image's HEALTHCHECK, probed every second instead of every 30
          healthy() {
            for _ in $(seq 1 60); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$1")
              test "$status" = healthy && return 0
              sleep 1
            done
            echo "$1 is $status" >&2
            docker logs "$1"
            return 1
          }
          # shellcheck disable=SC2086
          docker run -d --name rp -p 18080:8080 $hardened --health-interval 1s \
            -v rp-data:/var/lib/redirect-proxy redirect-proxy:ci
          healthy rp
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/missing)" = "404"
          docker logs rp
          # without the admin, the health check probes the redirect listener
          # shellcheck disable=SC2086
          docker run -d --name rp-noadmin $hardened --health-interval 1s \
            -e RP_ADMIN_ENABLED=false -v rp-data2:/var/lib/redirect-proxy redirect-proxy:ci
          healthy rp-noadmin
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: redirect-proxy:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
