version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # a visible changelog type, so that a base image fix (OpenSSL, musl...)
    # leads to a release instead of waiting for the next feat or fix
    commit-message:
      prefix: deps
